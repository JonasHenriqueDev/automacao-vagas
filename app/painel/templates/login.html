{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="login card">
  <h1>Entrar</h1>
  {% if sem_credenciais %}
    <p class="erro">Nenhum usuário cadastrado. Na VM, rode <code>python -m app criar-usuario</code>.</p>
  {% endif %}
  {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="usuario">Usuário</label>
    <input id="usuario" name="usuario" autocomplete="username" required autofocus>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <div class="acoes"><button class="primario">Entrar</button></div>
  </form>
</div>
{% endblock %}
